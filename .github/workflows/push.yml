name: Push CI

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: Codecademy/run-on-yarn@v1
        with:
          command: ${{ matrix.command }}
          node-version: 22

    strategy:
      fail-fast: false
      matrix:
        command: ["compile", "format:verify", "lint", "test:ci", "test:jest", "typecheck"]

on: push
